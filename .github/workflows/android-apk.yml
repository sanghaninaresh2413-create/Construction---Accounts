name: Build Construction Accounts APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app-icon.png'
      - '.github/workflows/Android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare App
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp app-icon.png resources/icon.png
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7 @capacitor/assets

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.naresh.constructionaccounts",
            "appName": "Construction Accounts",
            "webDir": "www"
          }
          EOF

      - name: Build Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Construction-Accounts-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
